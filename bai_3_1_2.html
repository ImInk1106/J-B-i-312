<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra năm nhuận</title>
</head>
<body>
    <h2>Kiểm tra năm nhuận</h2>
    <script>
        let year= parseInt(prompt("Nhập vào năm cần kiểm tra: "));
        let isLeapYear = false;
        if ((year % 400 == 0 )) || (year % 4 == 0 && year % 100 != 0 )) {
            isLeapYear= true;
        }
        if (isLeapYear){
            alert(year + ": năm nhuận");
            document.write("<h3>" + year + ":năm nhuận</h3>");
        } else {
            alert(year + ": năm không nhuận");
            document.write("<h3>" + year + ": năm không nhuận </h3>");
        }
    </script>
</body>
</html>
